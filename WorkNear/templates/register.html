{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-shell"><div class="form-card"><span class="eyebrow">JOIN WORKNEAR</span><h1 class="h2 fw-bold mt-2">{{ t.register }}</h1><p class="text-secondary">Create an account to find work or hire nearby workers.</p>
<form method="post" class="row g-3">
  <div class="col-12"><label class="form-label">{{ t.name }}</label><input name="name" class="form-control" required maxlength="80"></div>
  <div class="col-12"><label class="form-label">{{ t.phone }}</label><input name="phone" class="form-control" required inputmode="tel" maxlength="20"></div>
  <div class="col-12"><label class="form-label">{{ t.password }}</label><input name="password" type="password" class="form-control" minlength="6" required><div class="form-text">At least 6 characters.</div></div>
  <div class="col-md-6"><label class="form-label">Account type</label><select name="role" class="form-select"><option value="worker">{{ t.worker }}</option><option value="owner">{{ t.owner }}</option></select></div>
  <div class="col-md-6"><label class="form-label">{{ t.language }}</label><select name="language" class="form-select"><option value="en">English</option><option value="te">తెలుగు</option><option value="hi">हिन्दी</option></select></div>
  <div class="col-12"><label class="form-label">{{ t.skills }}</label><input name="skills" class="form-control" placeholder="e.g. Mason, painter, cleaning (optional)"></div>
  <div class="col-12"><button class="btn btn-primary btn-lg w-100">{{ t.register }}</button></div>
</form><p class="mt-3 mb-0 text-secondary">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></div>
{% endblock %}
